# Host nginx vhost for bookcatalogue.space
#
# Layout (docker-compose.yml):
#   - frontend container  -> host 127.0.0.1:8082 (React SPA, nginx)
#   - api container       -> host 127.0.0.1:8001 (FastAPI, uvicorn)
#
# Host nginx terminates TLS and routes:
#   /          -> frontend container (SPA, static assets)
#   /api/      -> api container       (strips the /api prefix)
#   /static/   -> api container       (cover images from UPLOAD_DIR)
#
# Install:
#   sudo cp deploy/bookcatalogue.space.conf /etc/nginx/sites-available/bookcatalogue.space
#   sudo ln -sf /etc/nginx/sites-available/bookcatalogue.space /etc/nginx/sites-enabled/bookcatalogue.space
#   sudo nginx -t && sudo systemctl reload nginx

upstream novel_frontend {
    server 127.0.0.1:8082;
    keepalive 16;
}

upstream novel_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

# HTTP: serve ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bookcatalogue.space www.bookcatalogue.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookcatalogue.space www.bookcatalogue.space;

    ssl_certificate     /etc/letsencrypt/live/bookcatalogue.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookcatalogue.space/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # FastAPI routes are /auth/..., /novels/... - strip the /api prefix via trailing slash
    location /api/ {
        proxy_pass http://novel_api/;
        proxy_read_timeout 75s;
        proxy_connect_timeout 75s;
    }

    location /static/ {
        proxy_pass http://novel_api;
    }

    location / {
        proxy_pass http://novel_frontend;
    }
}
