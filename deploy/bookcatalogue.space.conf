# Host nginx: single upstream to Docker frontend (port 8082).
# The frontend image proxies /api/ and /static/ to the API container — you do NOT need
# separate host locations for /api or /static unless you prefer routing them on the host.
#
# sudo cp deploy/bookcatalogue.space.conf /etc/nginx/sites-available/bookcatalogue.space
# sudo nginx -t && sudo systemctl reload nginx

upstream novel_frontend {
    server 127.0.0.1:8082;
}

server {
    listen 80;
    listen [::]:80;
    server_name bookcatalogue.space www.bookcatalogue.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookcatalogue.space www.bookcatalogue.space;

    ssl_certificate /etc/letsencrypt/live/bookcatalogue.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookcatalogue.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://novel_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
