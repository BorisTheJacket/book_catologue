# Frontend container: static SPA + reverse-proxy /api and /static to the FastAPI service (compose DNS name "api").
# So host nginx only needs one upstream to this container; /api/ does not have to be configured on the host.

upstream novel_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        try_files /favicon.ico @favicon_empty;
    }
    location @favicon_empty {
        log_not_found off;
        return 204;
    }

    location /api/ {
        proxy_pass http://novel_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_read_timeout 75s;
    }

    location /static/ {
        proxy_pass http://novel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
