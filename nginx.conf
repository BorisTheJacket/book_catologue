# SPA + proxy /api and /static to Compose service "api:8000".
# Resolver 127.0.0.11 = Docker embedded DNS so "api" resolves at request time (avoids stale upstream at nginx start).

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=10s;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        try_files /favicon.ico @favicon_empty;
    }
    location @favicon_empty {
        log_not_found off;
        return 204;
    }

    # Strip /api prefix for FastAPI (routes are /auth/..., /novels/..., not /api/...)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_read_timeout 75s;
    }

    location /static/ {
        set $upstream_static http://api:8000;
        proxy_pass $upstream_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
